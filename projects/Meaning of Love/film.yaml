# Written by `film init`. Everything here is a starting point.
# Change the numbers. That is what this file is for.
#
# Filename hints `init` understood, if you used any:
#   00_ 01_ ...     explicit order
#   open_ close_    which shot opens / closes the film
#   open_close_     the SAME image opens AND closes it
#   quote_          held longer, filename becomes a centered title
#
#   uv run film peek    seconds    -- is the ORDER right?
#   uv run film draft   <1 min     -- does the MOTION feel right?
#   uv run film final   minutes    -- ship it

fps: 24
resolution: [1080, 1920]   # vertical, for YouTube Shorts
# audio: media/voiceover.mp3   # optional separate narration
# title: the words on the thumbnail. Left out, the film is
#        called what its folder is called.
# music: found on its own -- this project's music/ folder if it
#        has one, otherwise your library/music/ folder.
music_volume: 0.6      # the level when nobody is talking
music_fade: 2.0        # seconds of fade in and out
music_duck: 0.5        # how far the music drops while you talk
                       # 0 = never drops. 1 = gets right out of the way

look:
  preset: old_film      # clean | warm | old_film | projector
  glow: 0.25            # lifts shadows -- better lighting

# Uncomment if a wide clip is losing too much to a tall frame.
# `blur` keeps the picture whole on a blurred copy of itself
# instead of cropping it. fill_aspect is the shape of the sharp
# part: 1.0 square, 0.8 taller and bigger, 1.33 shorter and safer.
# fill: blur
# fill_aspect: 1.0

shots:

  - id: s00
    src: analysis/title.jpg
    duration: 4.0
    move: static
    note: "the opening card -- the same picture and the same words
      as the thumbnail, so clicking the miniature lands you on the
      frame you clicked. Made from your library; delete this whole
      block if you would rather open on yourself talking."

  - id: s01
    src: media/rec_20260909-204941.mp4
    in: "00:00.00"
    out: "05:10.33"
    speed: 1.2              # 1.0 is the speed you actually spoke at
    move: static
    amount: 0.6            # how much of the move to use. 0 = none
    focus: [0.586, 0.376]
    note: "kept whole -- there is sound on this one, so none of what you said is cut. Trim in:/out: if it drags"
    captions:
      - text: "My parents never used the word."
        at: 1.98
        dur: 2.06
        pos: lower_third
      - text: "Love."
        at: 4.05
        dur: 0.94
        pos: lower_third
      - text: "They were ashamed of it."
        at: 5.68
        dur: 1.54
        pos: lower_third
      - text: "Hate words were easier."
        at: 8.54
        dur: 1.71
        pos: lower_third
      - text: "One was home."
        at: 11.03
        dur: 1.25
        pos: lower_third
      - text: "The other was in the cellar."
        at: 12.43
        dur: 1.96
        pos: lower_third
      - text: "I was running up and down the stairs,"
        at: 17.67
        dur: 2.83
        pos: lower_third
      - text: "negotiating peace."
        at: 20.50
        dur: 1.11
        pos: lower_third
      - text: "My father told me,"
        at: 23.72
        dur: 1.38
        pos: lower_third
      - text: "“Say sorry even if you were right.”"
        at: 25.10
        dur: 3.31
        pos: lower_third
      - text: "This was not love."
        at: 30.42
        dur: 1.21
        pos: lower_third
      - text: "People are ashamed of tenderness."
        at: 34.20
        dur: 2.43
        pos: lower_third
      - text: "I want to love."
        at: 37.25
        dur: 1.49
        pos: lower_third
      - text: "I love you."
        at: 40.25
        dur: 1.61
        pos: lower_third
      - text: "The heart races."
        at: 41.87
        dur: 3.26
        pos: lower_third
      - text: "It is a risk."
        at: 57.87
        dur: 0.53
        pos: lower_third
      - text: "Once, she knew I was going to say it."
        at: 58.90
        dur: 2.71
        pos: lower_third
      - text: "“Forget me,” she said."
        at: 63.26
        dur: 1.45
        pos: lower_third
      - text: "“It will be easier.”"
        at: 64.71
        dur: 1.19
        pos: lower_third
      - text: "For three months she had been weak."
        at: 65.91
        dur: 4.50
        pos: lower_third
      - text: "Tuberculosis suspected."
        at: 76.25
        dur: 1.83
        pos: lower_third
      - text: "Tall and hunched."
        at: 79.28
        dur: 3.20
        pos: lower_third
      - text: "A bent birch tree."
        at: 82.48
        dur: 1.56
        pos: lower_third
      - text: "Coughing."
        at: 84.54
        dur: 0.50
        pos: lower_third
      - text: "I brought her tangerines."
        at: 85.05
        dur: 3.61
        pos: lower_third
      - text: "And classes,"
        at: 88.67
        dur: 1.73
        pos: lower_third
      - text: "literature on tapes."
        at: 91.16
        dur: 1.20
        pos: lower_third
      - text: "We listened."
        at: 93.75
        dur: 0.73
        pos: lower_third
      - text: "I stayed  hours when she was sick."
        at: 96.13
        dur: 2.35
        pos: lower_third
      - text: "January."
        at: 99.38
        dur: 0.50
        pos: lower_third
      - text: "February."
        at: 100.75
        dur: 0.56
        pos: lower_third
      - text: "March."
        at: 102.05
        dur: 0.45
        pos: lower_third
      - text: "I thought April was perfect."
        at: 105.13
        dur: 2.13
        pos: lower_third
      - text: "Cherry and apple trees blooming."
        at: 116.87
        dur: 2.93
        pos: lower_third
      - text: "Petals in the air."
        at: 120.61
        dur: 1.15
        pos: lower_third
      - text: "I love you."
        at: 124.13
        dur: 1.38
        pos: lower_third
      - text: "I didn't say it."
        at: 126.50
        dur: 1.43
        pos: lower_third
      - text: "I was there."
        at: 128.18
        dur: 0.98
        pos: lower_third
      - text: "Perhaps that is love."
        at: 130.02
        dur: 1.88
        pos: lower_third
      - text: "Until she did not need me."
        at: 133.07
        dur: 2.48
        pos: lower_third
      - text: "Again, my father told me."
        at: 141.60
        dur: 2.00
        pos: lower_third
      - text: "You are a boy, boys do not complain."
        at: 143.60
        dur: 3.26
        pos: lower_third
      - text: "I studied, noone believed in me"
        at: 147.95
        dur: 3.04
        pos: lower_third
      - text: "That I would pass entrance exams."
        at: 151.00
        dur: 3.38
        pos: lower_third
      - text: "Only to prove I deserve."
        at: 155.75
        dur: 2.53
        pos: lower_third
      - text: "I thought this was love."
        at: 158.28
        dur: 3.68
        pos: lower_third
      - text: "Then I decided,"
        at: 162.82
        dur: 2.38
        pos: lower_third
      - text: "love does not exist."
        at: 165.20
        dur: 1.59
        pos: lower_third
      - text: "Yet."
        at: 170.30
        dur: 0.44
        pos: lower_third
      - text: "I think I saw it once."
        at: 171.03
        dur: 2.09
        pos: lower_third
      - text: "We were doing Combat Medical Training."
        at: 174.07
        dur: 2.43
        pos: lower_third
      - text: "The casualty was unconscious."
        at: 178.14
        dur: 3.18
        pos: lower_third
      - text: "One medic was doing everything correctly."
        at: 181.33
        dur: 4.50
        pos: lower_third
      - text: "Airway."
        at: 191.69
        dur: 0.59
        pos: lower_third
      - text: "Bleeding."
        at: 192.68
        dur: 0.44
        pos: lower_third
      - text: "Move him."
        at: 193.76
        dur: 0.78
        pos: lower_third
      - text: "The casualty's head bumped against the stretcher."
        at: 195.43
        dur: 3.20
        pos: lower_third
      - text: "He didn't notice."
        at: 199.74
        dur: 1.03
        pos: lower_third
      - text: "The other one did."
        at: 200.78
        dur: 4.50
        pos: lower_third
      - text: "Warm hands on his cheeks."
        at: 209.07
        dur: 2.48
        pos: lower_third
      - text: "Brushing the dirt away."
        at: 212.78
        dur: 1.31
        pos: lower_third
      - text: "One hand gently under his head."
        at: 215.04
        dur: 2.80
        pos: lower_third
      - text: "“Easy…”"
        at: 220.20
        dur: 0.43
        pos: lower_third
      - text: "“I've got you.”"
        at: 221.37
        dur: 1.25
        pos: lower_third
      - text: "“Stay with me.”"
        at: 223.77
        dur: 1.00
        pos: lower_third
      - text: "The casualty couldn't answer."
        at: 234.07
        dur: 2.11
        pos: lower_third
      - text: "But he kept talking to him."
        at: 236.69
        dur: 1.33
        pos: lower_third
      - text: "The commander noticed."
        at: 238.43
        dur: 1.51
        pos: lower_third
      - text: "One man saw a casualty."
        at: 239.94
        dur: 2.96
        pos: lower_third
      - text: "The other saw a human being."
        at: 244.99
        dur: 1.88
        pos: lower_third
      - text: "And I think…"
        at: 248.61
        dur: 1.73
        pos: lower_third
      - text: "that's love."
        at: 251.29
        dur: 0.83
        pos: lower_third

