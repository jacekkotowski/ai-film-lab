# Written by `film init`. Everything here is a starting point.
# Change the numbers. That is what this file is for.
#
# Filename hints `init` understood, if you used any:
#   00_ 01_ ...     explicit order
#   open_ close_    which shot opens / closes the film
#   open_close_     the SAME image opens AND closes it
#   quote_          held longer, filename becomes a centered title
#
#   uv run film peek    seconds    -- is the ORDER right?
#   uv run film draft   <1 min     -- does the MOTION feel right?
#   uv run film final   minutes    -- ship it

fps: 24
resolution: [1080, 1920]   # vertical, for YouTube Shorts
# Each picture carries its own piece of
# media/voiceover_20260918-103350.wav -- see `voice:` below.
# The newest of 2 recordings in media/. The older one(s) are not used;
# move them to media/_discarded/ to tidy up.
# title: the words on the thumbnail. Left out, the film is
#        called what its folder is called.
# music: found on its own -- this project's music/ folder if it
#        has one, otherwise your library/music/ folder.
music_volume: 0.6      # the level when nobody is talking
music_fade: 2.0        # seconds of fade in and out
music_duck: 0.5        # how far the music drops while you talk
                       # 0 = never drops. 1 = gets right out of the way

look:
  preset: old_film      # clean | warm | old_film | projector
  glow: 0.25            # lifts shadows -- better lighting

# Uncomment if a wide clip is losing too much to a tall frame.
# `blur` keeps the picture whole on a blurred copy of itself
# instead of cropping it. fill_aspect is the shape of the sharp
# part: 1.0 square, 0.8 taller and bigger, 1.33 shorter and safer.
# fill: blur
# fill_aspect: 1.0

# The room behind you softly blurred, you sharp -- on your own
# recordings (rec_*) only. 0 = off, 2 = twice as soft. About +45%
# render time. Barely shows in a vertical close-up: the crop is
# nearly all face. Another clip can ask for it with its own `bokeh:`.
bokeh: 1

shots:

  - id: s00
    src: analysis/title.jpg
    duration: 2.0
    move: static
    note: "the opening card -- the same picture and the same words
      as the thumbnail, so clicking the miniature lands you on the
      frame you clicked. Made from your library; delete this whole
      block if you would rather open on yourself talking."

  - id: s01
    src: media/1declaration_of_love.png
    voice: media/voiceover_20260918-103350.wav
    in: "00:01.45"
    out: "00:14.75"
    move: tilt_up
    focus: [0.649, 0.539]
    note: "picture 1 of 3 -- holds while these words are said"
    captions:
      - text: "I remember I was stressed and I just said,"
        at: 0.00
        dur: 4.46
        pos: lower_third
        words: [0.00, 0.72, 1.30, 1.62, 1.84, 2.36, 3.24, 3.58, 3.90]
      - text: "what I just said,"
        at: 5.29
        dur: 2.27
        pos: lower_third
        words: [0.00, 1.36, 1.52, 1.74]
      - text: "I'm stressed right now as much as I was then."
        at: 8.51
        dur: 4.26
        pos: lower_third
        words: [0.00, 1.02, 1.40, 1.70, 2.04, 2.60, 3.02, 3.26, 3.46, 3.76]

  - id: s02
    src: media/2declaration of love.png
    voice: media/voiceover_20260918-103350.wav
    in: "00:18.60"
    out: "00:37.25"
    move: push_in
    focus: [0.668, 0.565]
    note: "picture 2 of 3 -- holds while these words are said"
    captions:
      - text: "I said I wanted only to say and I had a hidden rose behind me."
        at: 2.97
        dur: 4.50
        pos: lower_third
        words: [0.00, 0.36, 0.86, 1.16, 1.38, 3.79, 4.19, 4.41]
      - text: "I wanted only to say and she answered,"
        at: 10.02
        dur: 4.34
        pos: lower_third
        words: [0.00, 0.24, 0.58, 0.92, 1.14, 1.88, 3.58, 3.84]
      - text: "I know what you want to say."
        at: 16.00
        dur: 2.33
        pos: lower_third
        words: [0.00, 0.76, 1.04, 1.40, 1.62, 1.80, 1.98]

  - id: s03
    src: media/3_declaration_of_love.png
    voice: media/voiceover_20260918-103350.wav
    in: "00:40.00"
    out: "00:59.15"
    move: pull_out
    focus: [0.767, 0.045]
    note: "picture 3 of 3 -- holds while these words are said"
    captions:
      - text: "It's better that you never come back."
        at: 0.12
        dur: 3.35
        pos: lower_third
        words: [0.00, 0.40, 0.70, 2.30, 2.52, 2.76, 3.08]
      - text: "It would be easier for us if you forget me,"
        at: 4.28
        dur: 2.69
        pos: lower_third
        words: [0.00, 0.12, 0.26, 0.46, 0.84, 1.12, 1.50, 1.86, 2.00, 2.34]
      - text: "but I didn't."
        at: 7.88
        dur: 1.17
        pos: lower_third
        words: [0.00, 0.46, 0.62]
      - text: "I refused to forget."
        at: 13.48
        dur: 1.60
        pos: lower_third
        words: [0.00, 0.36, 0.86, 1.18]

# 3 shots, about 52 seconds.
#
# 3 slide(s), one per picture, each holding its own piece of
# the 61s narration. Each `in:`/`out:` is that picture's words, on
# the narration's own clock. Move a shot and its words move with it;
# swap `src:` to put a different picture under the same words; hold
# one longer with `duration:` and the words stay where they were said.
#
# Cut where you pressed Next while recording, each cut moved to the
# nearest pause so no word is split. To change one, move these
# `in:`/`out:` numbers, or record the narration again.
