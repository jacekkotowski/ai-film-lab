        pos: lower_third
        words: [0.00, 0.32, 0.63, 0.98, 1.12, 1.45, 1.73, 1.87]
      - text: "measures what computers can learn about us"
        at: 3.69
        dur: 2.55
        pos: lower_third
        words: [0.00, 0.48, 1.07, 1.47, 1.73, 1.95, 2.18]
      - text: "from our behaviour online."
