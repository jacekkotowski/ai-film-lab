        pos: lower_third
        words: [0.00, 0.90, 1.18, 1.76, 2.08, 2.46, 2.76, 2.94, 3.34]
      - text: "Middle & Right:"
        at: 4.20
        dur: 2.09
        pos: lower_third
        words: [0.00, 1.38, 1.66]
      - text: "Unsharp Mask increases local edge contrast,"
        at: 6.98
        dur: 2.64
        pos: lower_third
        words: [0.00, 0.60, 0.80, 1.30, 1.76, 2.16]
