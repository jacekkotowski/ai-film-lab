        dur: 3.82
        pos: lower_third
        words: [0.00, 0.62, 1.08, 1.60, 2.30, 2.78, 3.18]

  - id: s08
    src: media/rec_20260920-200039.mp4
    in: "00:00.35"
    out: "00:22.60"
    speed: 1.2              # 1.0 is the speed you actually spoke at
    move: drift_left
    amount: 0.6            # how much of the move to use. 0 = none
