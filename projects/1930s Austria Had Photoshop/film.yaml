# Written by `film init`. Everything here is a starting point.
# Change the numbers. That is what this file is for.
#
# Filename hints `init` understood, if you used any:
#   00_ 01_ ...     explicit order
#   open_ close_    which shot opens / closes the film
#   open_close_     the SAME image opens AND closes it
#   quote_          held longer, filename becomes a centered title
#
#   uv run film peek    seconds    -- is the ORDER right?
#   uv run film draft   <1 min     -- does the MOTION feel right?
#   uv run film final   minutes    -- ship it

fps: 24
resolution: [1080, 1920]   # vertical, for YouTube Shorts
# Each picture carries its own piece of
# media/voiceover_20260920-195800.wav -- see `voice:` below.
# title: the words on the thumbnail. Left out, the film is
#        called what its folder is called.
# music: found on its own -- this project's music/ folder if it
#        has one, otherwise your library/music/ folder.
music_volume: 0.6      # the level when nobody is talking
music_fade: 2.0        # seconds of fade in and out
music_duck: 0.5        # how far the music drops while you talk
                       # 0 = never drops. 1 = gets right out of the way

look:
  preset: old_film      # clean | warm | old_film | projector
  glow: 0.25            # lifts shadows -- better lighting

# Uncomment if a wide clip is losing too much to a tall frame.
# `blur` keeps the picture whole on a blurred copy of itself
# instead of cropping it. fill_aspect is the shape of the sharp
# part: 1.0 square, 0.8 taller and bigger, 1.33 shorter and safer.
# fill: blur
# fill_aspect: 1.0

# The room behind you softly blurred, you sharp -- on your own
# recordings (rec_*) only. 0 = off, 2 = twice as soft. About +45%
# render time. Barely shows in a vertical close-up: the crop is
# nearly all face. Another clip can ask for it with its own `bokeh:`.
bokeh: 1

shots:

  - id: s00
    src: analysis/title.jpg
    duration: 2.0
    move: static
    note: "the opening card -- the same picture and the same words
      as the thumbnail, so clicking the miniature lands you on the
      frame you clicked. Made from your library; delete this whole
      block if you would rather open on yourself talking."

  - id: s01
    src: media/rec_20260920-195315.mp4
    in: "00:01.35"
    out: "00:27.60"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: static
    amount: 0.6            # how much of the move to use. 0 = none
    focus: [0.535, 0.353]
    note: "part 1 of 2 -- one take with the long pauses cut out. Every word is kept"
    captions:
      - text: "When you click on Unsharp Mask in Photoshop,"
        at: 0.00
        dur: 3.13
        pos: lower_third
        words: [0.00, 0.42, 0.55, 0.90, 1.48, 1.75, 2.17, 2.55]
      - text: "you might think it was created to make blurry portraits crisp."
        at: 3.56
        dur: 4.50
        pos: lower_third
        words: [0.00, 0.47, 0.63, 0.90, 1.07, 1.20, 1.58, 2.18, 2.55, 3.07, 3.75]
      - text: "But it was invented in 1930s Vienna by a medical physicist and a technician."
        at: 9.32
        dur: 4.50
        pos: lower_third
        words: [0.00, 0.42, 0.83, 0.97, 1.37, 1.67, 2.98, 3.40, 4.03, 4.45]
      - text: "Not to add detail, but to solve a life or death diagnostic problem."
        at: 16.57
        dur: 4.50
        pos: lower_third
        words: [0.00, 0.45, 0.65, 0.88, 1.47, 1.60, 1.82, 2.17, 2.45, 2.72, 3.05, 3.55, 4.23]
  - id: s02
    src: media/rec_20260920-195315.mp4
    in: "00:29.20"
    out: "00:30.10"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: drift_right
    amount: 0.6            # how much of the move to use. 0 = none
    focus: [0.535, 0.353]
    dissolve: 0.3      # blends in from the shot before. 0 = a hard cut
    note: "part 2 of 2 -- one take with the long pauses cut out. Every word is kept"

  - id: s03
    src: media/1_xray.jpg
    voice: media/voiceover_20260920-195800.wav
    in: "00:00.00"
    out: "00:25.25"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: push_in
    focus: [0.510, 0.804]
    note: "picture 1 of 5 -- holds while these words are said"
    captions:
      - text: "In 1930,"
        at: 0.42
        dur: 1.61
        pos: lower_third
        words: [0.00, 0.52]
      - text: "Gottfried Spiegler and Kalman Juris faced a"
        at: 2.03
        dur: 3.66
        pos: lower_third
        words: [0.00, 0.97, 1.78, 2.02, 2.38, 3.03, 3.40]
      - text: "problem with X-ray plates."
        at: 5.70
        dur: 1.46
        pos: lower_third
        words: [0.00, 0.33, 0.62, 0.92, 1.00]
      - text: "Medical radiographs had too much dynamic"
        at: 7.68
        dur: 2.36
        pos: lower_third
        words: [0.00, 0.42, 1.23, 1.40, 1.73, 2.00]
      - text: "range for photographic paper:"
        at: 10.05
        dur: 1.53
        pos: lower_third
        words: [0.00, 0.40, 0.62, 1.22]
      - text: "dense rib bones appeared solid white,"
        at: 12.10
        dur: 2.39
        pos: lower_third
        words: [0.00, 0.37, 0.65, 1.13, 1.40, 1.93]
      - text: "while lung tissue turned pitch black."
        at: 14.78
        dur: 2.48
        pos: lower_third
        words: [0.00, 0.37, 0.87, 1.28, 1.83, 2.15]
      - text: "Expose for the lungs, and the bones blew out."
        at: 18.43
        dur: 2.23
        pos: lower_third
        words: [0.00, 0.20, 0.37, 0.67, 0.98, 1.13, 1.48, 1.85]
  - id: s04
    src: media/2_roentgen.png
    voice: media/voiceover_20260920-195800.wav
    in: "00:26.85"
    out: "00:52.60"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: drift_right
    focus: [0.710, 0.526]
    note: "picture 2 of 5 -- holds while these words are said"
    captions:
      - text: "They created a physical fix."
        at: 0.00
        dur: 1.83
        pos: lower_third
        words: [0.00, 2.06, 2.44, 2.66, 2.91]
      - text: "A positive copy of the X-ray was exposed through"
        at: 1.83
        dur: 2.91
        pos: lower_third
        words: [0.00, 0.12, 0.38, 0.73, 1.00, 1.13, 1.42, 1.55, 1.83, 2.40]
      - text: "a thick glass spacer,"
        at: 4.75
        dur: 1.26
        pos: lower_third
        words: [0.00, 0.18, 0.37, 0.72]
      - text: "intentionally blurring the light and creating an unsharp mask."
        at: 6.63
        dur: 4.19
        pos: lower_third
        words: [0.00, 0.67, 1.30, 1.45, 1.70, 2.33, 2.80, 3.22, 3.87]
      - text: "Placed against the original negative,"
        at: 11.47
        dur: 2.08
        pos: lower_third
        words: [0.00, 0.50, 0.97, 1.25, 1.52]
      - text: "it acted like a mechanical dodge-and-burn tool,"
        at: 13.80
        dur: 2.33
        pos: lower_third
        words: [0.00, 0.10, 0.42, 0.63, 0.82, 1.15, 1.55, 1.72, 1.93]
      - text: "flattening global contrast so diagnostic details"
        at: 16.63
        dur: 3.04
        pos: lower_third
        words: [0.00, 0.57, 0.83, 1.38, 1.90, 2.35]
      - text: "could fit onto paper."
        at: 19.68
        dur: 1.38
        pos: lower_third
        words: [0.00, 0.52, 0.73, 1.03]
  - id: s05
    src: media/3_portrait_process.png
    voice: media/voiceover_20260920-195800.wav
    in: "00:54.40"
    out: "01:20.25"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: push_in
    focus: [0.330, 0.832]
    note: "picture 3 of 5 -- holds while these words are said"
    captions:
      - text: "Because the mask was blurred,"
        at: 0.00
        dur: 2.02
        pos: lower_third
        words: [0.00, 1.12, 1.63, 2.00, 2.17]
      - text: "it could cancel broad areas but not fine details."
        at: 2.02
        dur: 3.51
        pos: lower_third
        words: [0.00, 0.43, 0.62, 1.05, 1.38, 1.98, 2.30, 2.57, 2.95]
      - text: "At boundaries, this created light and dark halos."
        at: 6.35
        dur: 2.38
        pos: lower_third
        words: [0.00, 0.30, 0.72, 1.18, 1.58, 1.90, 2.13]
      - text: "Spiegler and Juris created them as a side"
        at: 10.08
        dur: 2.31
        pos: lower_third
        words: [0.00, 0.48, 0.72, 1.10, 1.40, 1.75, 1.97, 2.07]
      - text: "effect of contrast compression."
        at: 12.40
        dur: 1.81
        pos: lower_third
        words: [0.00, 0.33, 0.80, 1.22]
      - text: "Photographers later applied the technique to portraits,"
        at: 15.02
        dur: 2.90
        pos: lower_third
        words: [0.00, 0.53, 0.92, 1.43, 1.75, 2.10, 2.43]
      - text: "using the halos to create the illusion of sharper focus."
        at: 17.92
        dur: 3.08
        pos: lower_third
        words: [0.00, 0.53, 0.78, 1.30, 1.43, 1.70, 1.92, 2.13, 2.37, 2.70]
  - id: s06
    src: media/4_eye.png
    voice: media/voiceover_20260920-195800.wav
    in: "01:22.25"
    out: "01:44.65"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: pull_out
    focus: [0.440, 0.478]
    note: "picture 4 of 5 -- holds while these words are said"
    captions:
      - text: "In a portrait, the same principle applies."
        at: 0.00
        dur: 2.20
        pos: lower_third
        words: [0.00, 0.37, 0.50, 0.80, 1.17, 1.35, 1.75]
      - text: "Blur the original,"
        at: 2.69
        dur: 0.73
        pos: lower_third
        words: [0.00, 0.18, 0.37]
      - text: "subtract the blurred copy to isolate fine edges,"
        at: 3.81
        dur: 2.58
        pos: lower_third
        words: [0.00, 0.30, 0.67, 0.90, 1.23, 1.40, 1.77, 2.12]
      - text: "then add those edges back."
        at: 6.98
        dur: 1.73
        pos: lower_third
        words: [0.00, 0.33, 0.82, 1.08, 1.42]
      - text: "Eyelashes, iris,"
        at: 9.46
        dur: 1.41
        pos: lower_third
        words: [0.00, 0.97]
      - text: "and skin contours become more defined."
        at: 10.87
        dur: 2.38
        pos: lower_third
        words: [0.00, 0.15, 0.43, 1.10, 1.53, 1.82]
      - text: "No new detail is created;"
        at: 13.99
        dur: 1.39
        pos: lower_third
        words: [0.00, 0.22, 0.45, 0.77, 1.00]
      - text: "existing detail gains local contrast."
        at: 15.86
        dur: 2.41
        pos: lower_third
        words: [0.00, 0.53, 0.90, 1.38, 1.77]
  - id: s07
    src: media/5_example.jpg
    voice: media/voiceover_20260920-195800.wav
    in: "01:46.95"
    out: "02:04.10"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    from: {cx: 0.14, cy: 0.5, scale: 1.0}
    to:   {cx: 0.86, cy: 0.5, scale: 1.0}
    ease: linear
    note: "picture 5 of 5 -- holds while these words are said.
      A full left-to-right sweep, set by hand. This picture is 600x260,
      4.1x wider than the 1080x1920 frame, so the crop window at scale
      1.0 is only 0.24 of its width -- and `drift_right` travels DRIFT
      (0.045) of the FRAME's width, which on this picture is nothing.
      cx 0.14 -> 0.86 travels 0.72 of the source, about three window
      widths: left panel, middle, right, which is the order the words
      name them in. `linear`, not the default ease, because a sweep
      that slows at both ends reads as a drift again."
    captions:
      - text: "Left: Natural contrast and detail on the camera negative."
        at: 0.18
        dur: 3.31
        pos: lower_third
        words: [0.00, 0.75, 0.98, 1.47, 1.73, 2.05, 2.30, 2.45, 2.78]
      - text: "Middle & Right:"
        at: 3.50
        dur: 1.74
        pos: lower_third
        words: [0.00, 1.15, 1.38]
      - text: "Unsharp Mask increases local edge contrast,"
        at: 5.82
        dur: 2.20
        pos: lower_third
        words: [0.00, 0.50, 0.67, 1.08, 1.47, 1.80]
      - text: "enhancing hair, facial lines,"
        at: 8.53
        dur: 2.20
        pos: lower_third
        words: [0.00, 0.63, 1.40, 1.77]
      - text: "and fabric folds without changing image resolution."
        at: 10.73
        dur: 3.18
        pos: lower_third
        words: [0.00, 0.52, 0.90, 1.33, 1.92, 2.32, 2.65]
  - id: s08
    src: media/rec_20260920-200039.mp4
    in: "00:00.35"
    out: "00:22.60"
    speed: 1.2              # one film, one voice: your takes and your narration
                            # both play at 1.2. See docs/decisions/0010.
    move: drift_left
    amount: 0.6            # how much of the move to use. 0 = none
    focus: [0.544, 0.377]
    note: "kept whole -- there is sound on this one, so none of what you said is cut. Trim in:/out: if it drags"
    captions:
      - text: "Spiegler and Juris called their process harmonization,"
        at: 0.00
        dur: 3.73
        pos: lower_third
        words: [0.00, 0.78, 1.05, 1.60, 1.87, 2.20, 2.68]
      - text: "designed to compress extreme dynamic range in medical imaging."
        at: 4.08
        dur: 3.34
        pos: lower_third
        words: [0.00, 0.37, 0.70, 1.03, 1.43, 1.90, 2.33, 2.53, 2.85]
      - text: "Decades later,"
        at: 8.30
        dur: 0.81
        pos: lower_third
        words: [0.00, 0.42]
      - text: "those darkroom variables became digital code."
        at: 9.27
        dur: 2.41
        pos: lower_third
        words: [0.00, 0.22, 0.78, 1.28, 1.67, 2.05]
      - text: "A medical tool for preserving diagnostic information became"
        at: 12.43
        dur: 3.34
        pos: lower_third
        words: [0.00, 0.12, 0.38, 0.72, 1.00, 1.45, 1.97, 2.58]
      - text: "Photoshop’s familiar Unsharp Mask."
        at: 15.78
        dur: 2.36
        pos: lower_third
        words: [0.00, 0.82, 1.27, 2.05]
# 8 shots, about 160 seconds.
#
# 5 slide(s), one per picture, each holding its own piece of
# the 124s narration. Each `in:`/`out:` is that picture's words, on
# the narration's own clock. Move a shot and its words move with it;
# swap `src:` to put a different picture under the same words; hold
# one longer with `duration:` and the words stay where they were said.
#
# Cut where you pressed Next while recording, each cut moved to the
# nearest pause so no word is split. To change one, move these
# `in:`/`out:` numbers, or record the narration again.
