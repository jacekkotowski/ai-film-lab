    in: "00:01.20"
    out: "00:14.10"
    speed: 1.2              # 1.0 is the speed you actually spoke at
    move: static
    amount: 0.6            # how much of the move to use. 0 = none
    focus: [0.495, 0.382]
    note: "kept whole -- there is sound on this one, so none of what you said is cut. Trim in:/out: if it drags"
    captions:
      - text: "What if heat could be turned into a picture?"
        at: 0.00
        dur: 2.63
        pos: lower_third
        words: [0.00, 0.47, 0.67, 0.98, 1.32, 1.48, 1.80, 2.18, 2.33]
      - text: "Before thermal cameras,"
        at: 3.62
        dur: 1.26
        pos: lower_third
        words: [0.00, 0.23, 0.65]
      - text: "scientists had to make invisible infrared radiation visible."
        at: 5.18
