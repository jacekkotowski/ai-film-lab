[project]
name = "ffilm"
version = "0.1.0"
description = "A small, readable film compiler: film.yaml in, cinema out."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",   # 5.0 removed CascadeClassifier -- see ingest.faces_available
    "pillow>=10",
    "pyyaml>=6",
]

# Optional. Only installed if you ask for it:  uv sync --extra data
[project.optional-dependencies]
data = ["manim>=0.18"]
voice = ["faster-whisper>=1.0"]

# Not a dependency of the film -- only of changing the code. Nobody
# making a film ever installs this.  uv run --extra dev pytest -q
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
film = "ffilm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffilm"]
